# Kadomo's kitty config: the current Kadomo theme's colors and the same look as Ghostty.

# Colors come from the current Kadomo theme (theme-set switches it).
include ~/.config/kadomo/current/theme/kitty.conf

# Ghostty's default font and size. kitty lists only fixed-pitch fonts, so this is
# the Nerd Font Mono variant (Kadomo Menu's font install adds it). kitty falls
# back to its own font if it is missing.
font_family JetBrainsMono Nerd Font Mono
font_size 13.0

# Translucent, blurred window background, as in config.ghostty.
background_opacity 0.75
background_blur 20

# Ghostty's default padding between the text and the window edge, in points.
window_padding_width 2

# Like Ghostty: the title bar, with its window buttons, takes the window's own
# background instead of a separate gray bar.
macos_titlebar_color background
