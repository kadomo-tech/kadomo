# White: a light theme after Dieter Rams's Braun designs. Neutral off-white
# panels, near-black ink for text, and a single signal orange as the accent;
# the other hues are quiet and a little gray, like the dials and indicator
# lights on a Braun radio, so the white stays in charge.
mode = "light"

accent = "#c8401a"
selection = "#d5dade"
muted = "#9a9c9b"

background = "#f2f2ef"
dark_background = "#e9e9e5"
darker_background = "#dddcd7"
lighter_background = "#fafaf8"

foreground = "#222222"
dark_foreground = "#5a5c5d"
light_foreground = "#3a3a3a"
bright_foreground = "#111111"

red = "#b02e26"
green = "#4d7537"
yellow = "#9a7300"
orange = "#c8401a"
blue = "#3c6683"
magenta = "#86486a"
cyan = "#2e7378"
brown = "#6b5a4a"

bright_red = "#c93a30"
bright_green = "#5c8742"
bright_yellow = "#b08600"
bright_orange = "#de4f22"
bright_blue = "#4a7896"
bright_magenta = "#9c587d"
bright_cyan = "#38868b"

cursor = "#c8401a"

# Editor shades for Vim and Neovim.
comment = "#8c8f90"

# Window borders: signal orange at the top left to a cool gray at the bottom right.
hyprland_active_border = "rgba(c8401aff) rgba(a3a9adff) 45deg"
inactive_border = "#dddcd7"

# OmniWM's workspace bar text: plain black ink, like a Braun label.
bar_text = "#222222"
