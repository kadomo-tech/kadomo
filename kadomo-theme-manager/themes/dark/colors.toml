# Dark: the plain dark gray of macOS Recovery and of Dark Mode windows,
# #1e1e1e, in shades of gray from black to white with Apple's system blue
# as the one color, kept to the accent: the menu's highlights, VS Code,
# the prompt. The hues, blue included, are grays of different weights, so
# btop, the terminal, the editor, and the window borders stay monochrome;
# only red keeps a little color, dimmed, so errors and deletions stand out.
mode = "dark"

accent = "#0a84ff"
selection = "#3a3a3a"
muted = "#8e8e8e"

background = "#1e1e1e"
dark_background = "#181818"
darker_background = "#121212"
lighter_background = "#2a2a2a"

foreground = "#dcdcdc"
dark_foreground = "#989898"
light_foreground = "#e8e8e8"
bright_foreground = "#f5f5f5"

red = "#c25b55"
green = "#a0a0a0"
yellow = "#f5f5f5"
orange = "#c8c8c8"
blue = "#d0d0d0"
magenta = "#8c8c8c"
cyan = "#b8b8b8"
brown = "#7a7a7a"

bright_red = "#d4706a"
bright_green = "#b4b4b4"
bright_yellow = "#ffffff"
bright_orange = "#d8d8d8"
bright_blue = "#e6e6e6"
bright_magenta = "#a0a0a0"
bright_cyan = "#cccccc"

cursor = "#dcdcdc"

# Editor shades for Vim and Neovim.
comment = "#8e8e8e"

# Window borders: a mid-gray at the top left to a darker gray at the bottom right.
hyprland_active_border = "rgba(8c8c8cff) rgba(555555ff) 45deg"
inactive_border = "#2a2a2a"

# OmniWM's workspace bar text: the off-white of Dark Mode labels.
bar_text = "#dcdcdc"
